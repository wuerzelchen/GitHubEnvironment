name: Multi-Stage Deployment

on:
  push:
    branches:
      - main
      - envs
  workflow_dispatch:

jobs:
  initialization:
    uses: wuerzelchen/ReusableWorkflows/.github/workflows/initialize.yaml@main
  
  plan:
    needs: initialization
    strategy:
      matrix:
        target: [dev, prod]
    uses: wuerzelchen/ReusableWorkflows/.github/workflows/plan.yaml@main
    with:
      environment: ${{ matrix.target }}
    
  deploy_dev:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    if: #{{ matrix.target == 'dev' }}
    steps:
      - name: Deploy DEV
        run: |
          echo "Deploying to DEV environment..."
          # Add your DEV deployment commands
          echo "DEV Deployment complete."
  
  deploy_prod:
    needs: plan
    environment: prod
    if: #{{ matrix.target == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy PROD
        run: |
          echo "Deploying to PROD environment..."
          # Add your PROD deployment commands
          echo "PROD Deployment complete."
