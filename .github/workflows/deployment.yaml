name: Multi-Stage Deployment

on:
  push:
    branches:
      - main
      - envs
  workflow_dispatch:

jobs:
  initialization:
    uses: wuerzelchen/ReusableWorkflows/.github/workflows/initialize.yaml@main
  
  plan:
    needs: initialization
    strategy:
      matrix:
        environment: [dev]
    uses: wuerzelchen/ReusableWorkflows/.github/workflows/plan.yaml@main
    with:
      environment: ${{ matrix.environment }}
  
  deploy:
    environment: ${{ needs.plan.outputs.environment }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Deploy PROD
        run: |
          echo "Deploying to ${{ needs.plan.output.environment }} environment..."
          # Add your PROD deployment commands
          echo "PROD Deployment complete."
