name: Multi-Stage Deployment

on:
  push:
    branches:
      - main
      - envs

jobs:
  initialization:
    uses: wuerzelchen/ReusableWorkflows/.github/workflows/initialize.yaml@main
  
  planning_dev:
    needs: initialization
    runs-on: ubuntu-latest
    steps:
      - name: Planning DEV
        run: echo "Running planning for DEV environment..."
  
  planning_prod:
    needs: initialization
    runs-on: ubuntu-latest
    steps:
      - name: Planning PROD
        run: echo "Running planning for PROD environment..."
  
  deploy_dev:
    needs: planning_dev
    runs-on: ubuntu-latest
    steps:
      - name: Deploy DEV
        run: |
          echo "Deploying to DEV environment..."
          # Add your DEV deployment commands
          echo "DEV Deployment complete."
  
  deploy_prod:
    needs: planning_prod
    runs-on: ubuntu-latest
    steps:
      - name: Deploy PROD
        run: |
          echo "Deploying to PROD environment..."
          # Add your PROD deployment commands
          echo "PROD Deployment complete."
