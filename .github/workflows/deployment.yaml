name: Multi-Stage Deployment

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:

jobs:
  initialization:
    uses: wuerzelchen/ReusableWorkflows/.github/workflows/initialize.yaml@main
  
  plan:
    needs: initialization
    strategy:
      matrix:
        environment: [dev, prod]
    uses: wuerzelchen/ReusableWorkflows/.github/workflows/plan.yaml@main
    with:
      environment: ${{ matrix.environment }}
  
  deploy:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ${{ github.ref_name }} Environment
        run: |
          echo "Deploying to ${{ github.ref_name }} environment..."
          # Add your ${{ github.ref_name }} deployment commands
          echo "${{ github.ref_name }} Deployment complete."
